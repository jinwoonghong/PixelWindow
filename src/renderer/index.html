<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelWindow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: 'Courier New', monospace;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #debugInfo {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #00ff00;
      padding: 10px;
      font-size: 12px;
      font-family: monospace;
      border-radius: 4px;
      pointer-events: none;
      z-index: 9999;
    }

    #menu {
      position: fixed;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #333;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 10000;
      min-width: 200px;
    }

    #menu.visible {
      display: block;
    }

    #menu h3 {
      text-align: center;
      margin-bottom: 10px;
      color: #333;
    }

    #menu .stats {
      margin: 10px 0;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 4px;
    }

    #menu .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }

    #menu button {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    #menu button:hover {
      background: #45a049;
    }

    #menu button.danger {
      background: #f44336;
    }

    #menu button.danger:hover {
      background: #da190b;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="debugInfo">
    <div>FPS: <span id="fps">0</span></div>
    <div>Pet: (<span id="petX">0</span>, <span id="petY">0</span>)</div>
    <div>State: <span id="petState">idle</span></div>
  </div>

  <div id="menu">
    <h3>🐕 강아지 🐕</h3>
    <div class="stats">
      <div class="stat-row">
        <span>❤️ 행복도:</span>
        <span id="happiness">100%</span>
      </div>
      <div class="stat-row">
        <span>🍖 배고픔:</span>
        <span id="hunger">100%</span>
      </div>
      <div class="stat-row">
        <span>⚡ 에너지:</span>
        <span id="energy">100%</span>
      </div>
      <div class="stat-row">
        <span>⭐ 레벨:</span>
        <span id="level">1</span>
      </div>
    </div>
    <button id="statsBtn">📊 통계 보기</button>
    <button id="settingsBtn">⚙️ 설정</button>
    <button id="closeMenuBtn">닫기</button>
    <button id="quitBtn" class="danger">❌ 종료</button>
  </div>

  <script src="index.js"></script>
</body>
</html>
