<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelWindow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: 'Courier New', monospace;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #debugInfo {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #00ff00;
      padding: 10px;
      font-size: 12px;
      font-family: monospace;
      border-radius: 4px;
      pointer-events: none;
      z-index: 9999;
    }

    #menu {
      position: fixed;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #333;
      border-radius: 6px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 10000;
      width: 160px;
    }

    #menu.visible {
      display: block;
    }

    #menu h3 {
      text-align: center;
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;
    }

    #menu .stats {
      margin: 8px 0;
      padding: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      font-size: 11px;
    }

    #menu .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 3px 0;
    }

    #menu button {
      width: 100%;
      padding: 6px;
      margin: 3px 0;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }

    #menu button:hover {
      background: #45a049;
    }

    #menu button.danger {
      background: #f44336;
    }

    #menu button.danger:hover {
      background: #da190b;
    }

    #customizeModal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.98);
      border: 3px solid #333;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 10001;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
    }

    #customizeModal.visible {
      display: block;
    }

    #customizeModal h2 {
      text-align: center;
      margin-bottom: 15px;
      color: #333;
    }

    .accessory-category {
      margin: 15px 0;
    }

    .accessory-category h3 {
      color: #555;
      margin-bottom: 10px;
      font-size: 16px;
      border-bottom: 2px solid #ddd;
      padding-bottom: 5px;
    }

    .accessory-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .accessory-item {
      background: #f9f9f9;
      border: 2px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .accessory-item:hover {
      transform: scale(1.05);
      border-color: #4CAF50;
    }

    .accessory-item.equipped {
      background: #c8e6c9;
      border-color: #4CAF50;
    }

    .accessory-item.locked {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .accessory-item .name {
      font-weight: bold;
      margin: 5px 0;
    }

    .accessory-item .desc {
      font-size: 11px;
      color: #666;
    }

    .accessory-item .requirement {
      font-size: 10px;
      color: #999;
      margin-top: 5px;
    }

    #customizeModal .close-btn {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background: #666;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    #customizeModal .close-btn:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="debugInfo">
    <div>FPS: <span id="fps">0</span></div>
    <div>Pet: (<span id="petX">0</span>, <span id="petY">0</span>)</div>
    <div>State: <span id="petState">idle</span></div>
  </div>

  <div id="menu">
    <h3>🐕 강아지 🐕</h3>
    <div class="stats">
      <div class="stat-row">
        <span>❤️ 행복도:</span>
        <span id="happiness">100%</span>
      </div>
      <div class="stat-row">
        <span>🍖 배고픔:</span>
        <span id="hunger">100%</span>
      </div>
      <div class="stat-row">
        <span>⚡ 에너지:</span>
        <span id="energy">100%</span>
      </div>
      <div class="stat-row">
        <span>⭐ 레벨:</span>
        <span id="level">1</span>
      </div>
    </div>
    <button id="customizeBtn">🎨 꾸미기</button>
    <button id="statsBtn">📊 통계 보기</button>
    <button id="settingsBtn">⚙️ 설정</button>
    <button id="closeMenuBtn">닫기</button>
    <button id="quitBtn" class="danger">❌ 종료</button>
  </div>

  <div id="customizeModal">
    <h2>🎨 강아지 꾸미기</h2>
    <div id="accessoriesContainer"></div>
    <button class="close-btn" id="closeCustomizeBtn">닫기</button>
  </div>

  <script src="index.js"></script>
</body>
</html>
